version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: traffic_db
    environment:
      - POSTGRES_DB=traffic_db
      - POSTGRES_USER=traffic_admin
      - POSTGRES_PASSWORD=traffic_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_admin -d traffic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: traffic_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    container_name: traffic_api
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://traffic_admin:traffic_pass@db:5432/traffic_db
      - DATABASE_SYNC_URL=postgresql://traffic_admin:traffic_pass@db:5432/traffic_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=4eb8d9bfd68e596da34b45efea01c80f123456789abcdef0123456789abcdef
      - ALLOWED_ORIGINS=*
      - TORCH_FORCE_WEIGHTS_ONLY_LOAD=0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    container_name: traffic_worker
    command: celery -A backend.app.tasks.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app/backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://traffic_admin:traffic_pass@db:5432/traffic_db
      - DATABASE_SYNC_URL=postgresql://traffic_admin:traffic_pass@db:5432/traffic_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=4eb8d9bfd68e596da34b45efea01c80f123456789abcdef0123456789abcdef
      - TORCH_FORCE_WEIGHTS_ONLY_LOAD=0
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    container_name: traffic_beat
    command: celery -A backend.app.tasks.celery_app.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app/backend
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  frontend-builder:
    image: node:20-alpine
    container_name: traffic_frontend_builder
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run build"

  nginx:
    image: nginx:alpine
    container_name: traffic_nginx
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
      # Mount built frontend assets from the shared workspace dist directory
      - ./dist:/usr/share/nginx/html
    depends_on:
      - api
      - frontend-builder

volumes:
  postgres_data:
